name: ocrust

on:
  push:
    branches: [main]
    paths: ['ocrust/**', '.github/workflows/ocrust.yml']
  pull_request:
    paths: ['ocrust/**', '.github/workflows/ocrust.yml']
  workflow_dispatch:

concurrency:
  group: ocrust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ocrust

jobs:
  rust:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ocrust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The unit tests need no models and no ONNX Runtime.
      - run: cargo test -p ocrust-core --lib

  python-lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check python tests scripts examples
      - run: ruff format --check python tests scripts examples

  wheels:
    name: wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, test: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, test: true }
          - { os: macos-latest, target: aarch64-apple-darwin, test: true }
          # GitHub retired the Intel macOS runners, so this wheel is
          # cross-compiled on Apple Silicon and cannot be run here.
          - { os: macos-latest, target: x86_64-apple-darwin, test: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ocrust
      - name: Build wheel
        run: |
          pip install "maturin>=1.7,<2.0"
          maturin build --release --target ${{ matrix.target }} -o dist
      - name: Build the model wheel
        run: python scripts/build_models_wheel.py --models-dir models/ppocrv6 -o dist
      - name: Install and test
        if: matrix.test
        run: |
          pip install --find-links dist "ocrust[models]" pytest numpy pillow
          python -c "import ocrust; print(ocrust.__version__); print(ocrust.runtime_info())"
          ocrust languages
          # Models ship with the wheel, so the full suite runs here.
          pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: ocrust/dist/*.whl

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/ocrust-v')
    needs: [rust, python-lint, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
